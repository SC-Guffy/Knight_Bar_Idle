# Render Blueprint — 대시보드에서 New → Blueprint 로 이 저장소를 연결하면 서버와 DB가 함께 만들어진다.
services:
  - type: web
    name: knight-bar
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: knight-bar-db
          property: connectionString

databases:
  - name: knight-bar-db
    plan: free
