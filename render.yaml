# Render Blueprint — 대시보드에서 New → Blueprint 로 이 저장소를 연결하면 웹 서비스가 만들어진다.
# DB는 Supabase Postgres 를 쓴다. DATABASE_URL 은 비밀번호가 들어 있어서 저장소에 두지 않고
# Render 대시보드 → knight-bar → Environment 에서 직접 넣는다 (Supabase 의 Session pooler 연결 문자열).
services:
  - type: web
    name: knight-bar
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      # 전체 초기화(POST /api/admin/reset)용 비밀 키. 대시보드에서 직접 넣는다. 없으면 초기화 주소가 닫혀 있다
      - key: ADMIN_KEY
        sync: false
