<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>룬 아이콘 검토</title>
<style>
@font-face { font-family: G; src: url(../../src/skin/Galmuri11.woff2); }
body { margin: 0; padding: 16px 20px 40px; background: #1d1828; color: #ece6f6; font: 13px/1.6 G, sans-serif; }
h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 14px; margin: 22px 0 6px; color: #ffd257; }
small, .mut { color: #a59cb8; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.c { background: #2b2538; border: 2px solid #0b0a14; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.row { display: flex; align-items: end; gap: 10px; }
.rn { display: inline-block; background: url(../../src/skin/runes.png) no-repeat; image-rendering: pixelated; }
.x1 { width: 32px; height: 32px; } .x2 { width: 64px; height: 64px; background-size: 1600px 64px; } .x4 { width: 128px; height: 128px; background-size: 3200px 128px; }
.emo { font-size: 26px; width: 34px; text-align: center; }
.bw .rn { filter: grayscale(1) contrast(1.3); }
.frame { color: #a59cb8; font-size: 11px; }
.strip .rn { margin: 2px; }
.light { background: #ebe7dc; padding: 8px; }
</style></head><body>
<h1>룬 아이콘 25종 (32×32 PixelLab)</h1>
<div class="mut">스펙 docs/specs/rune-icons.md · 틀 셋: 판석(범용 14) · 결정(모양 4) · 금테 메달(전설 7) · 등급은 게임에서 1px 테두리 색으로</div>

<h2>한 줄 (1배 · 게임 크기)</h2>
<div class="strip" id="s1"></div>
<h2>흑백 (틀·문양 겹침 확인)</h2>
<div class="strip bw" id="s2"></div>
<h2>밝은 바탕</h2>
<div class="strip light" id="s3"></div>
<h2>한 장씩 (전 = 지금 이모지 · 1× · 2× · 4×)</h2>
<div class="grid" id="g"></div>
<script>
const R = [
  ['exec','처형','🗡️','판석'],['boss','거인 사냥','👑','판석'],['first','선봉','🚩','판석'],['solo','일기토','⚖️','판석'],['crowd','겁화','🔥','판석'],
  ['dot','출혈','🩸','판석'],['double','과부하','⚡','판석'],['stack','가속','🌀','판석'],['vuln','약점','💢','판석'],['refund','재장전','🔁','판석'],
  ['haste','속사','💨','판석'],['chain','연결','✨','판석'],['range','확장','↔️','판석'],['overkill','관통','➡️','판석'],
  ['twin','한 번 더','⚔️','결정'],['after','잔상','👻','결정'],['burst','파열','💥','결정'],['more','난무','🌪️','결정'],
  ['L-blade','전설 · 검의 길','🕰️','메달'],['L-frenzy','전설 · 광란','🔥','메달'],['L-endless','전설 · 무한검','♾️','메달'],['L-echo','전설 · 잔영','👤','메달'],
  ['L-myriad','전설 · 만검귀종','🗡️','메달'],['L-reach','전설 · 심검','🌙','메달'],['L-zen','전설 · 무념','☯️','메달'],
];
const cell = (i, k) => `<i class="rn x${k}" style="background-position:-${i * 32 * k}px 0"></i>`;
for (const id of ['s1', 's2', 's3']) document.getElementById(id).innerHTML = R.map((r, i) => cell(i, id === 's1' ? 1 : 2)).join('');
document.getElementById('g').innerHTML = R.map((r, i) => `<div class="c"><b>${r[1]}</b><span class="frame">${r[0]} · ${r[3]}</span>
  <div class="row"><span class="emo">${r[2]}</span>${cell(i, 1)}${cell(i, 2)}</div>${cell(i, 4)}</div>`).join('');
</script>
</body></html>
