<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>스킬·평타 테스트 (개발용)</title>
<!--
  개발 확인용 스킬 모션 테스트 페이지. 게임(index.html)은 이 페이지를 불러오지 않고, 앱 패키지에도 들어가지 않는다 (package.json build.files 는 src/ 만 포함).
  로컬에서만 동작한다:  python3 -m http.server 8765  →  http://localhost:8765/dev/skills.html
  왼쪽에 기사, 오른쪽에 허수아비를 세워 두고 실제 게임 코드(src/world.js · src/skills.js)로 스킬을 쓴다.
-->
<style>
  :root { --bg: #14161d; --panel: #1d2029; --line: rgba(255,255,255,.09); --text: #f3efe6; --muted: rgba(243,239,230,.6); --accent: #ffb13b; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 14px; }
  #stage { position: relative; background: #0b0d14; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  #c { display: block; image-rendering: pixelated; }
  #gold, #barLayer { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
  .row > .label { color: var(--muted); min-width: 64px; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
  button:hover { background: #262a36; }
  button.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .info { margin-top: 12px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-height: 40px; }
  .info b { font-size: 14px; }
  .info .meta { color: var(--muted); margin-top: 3px; }
  #blocked { display: none; padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main id="app">
  <h1>⚔️ 스킬·평타 모션 테스트 <small style="color:var(--muted)">개발용</small></h1>
  <div class="sub">실제 게임 렌더링 코드로 그립니다. 스킬 수치는 src/classes.js 의 SKILLS, 스킬 연출은 src/skills.js 의 SKILL_FX, 평타 모션은 src/world.js 의 HERO_ATK.</div>
  <div id="stage"><canvas id="c"></canvas><span id="gold"></span><div id="barLayer"></div></div>
  <div class="row"><span class="label">모드</span><span id="modes" class="row" style="margin:0"></span></div>
  <div class="row"><span class="label">직업</span><span id="classes" class="row" style="margin:0"></span></div>
  <div class="row"><span class="label" id="pickLabel">스킬</span><span id="skills" class="row" style="margin:0"></span></div>
  <div class="row" id="stageRow"><span class="label">숙련</span><span id="stages" class="row" style="margin:0"></span></div>
  <div class="row"><span class="label">재생</span>
    <button id="auto">🔁 자동 반복</button>
    <button id="allCls">🌐 전 직업 순회</button>
    <button id="basic">🗡️ 사이에 평타</button>
    <button id="pause">⏸ 일시정지</button>
    <button id="step">⏭ 한 프레임</button>
    <span class="label" style="margin-left:10px">속도</span>
    <span id="speeds" class="row" style="margin:0"></span>
  </div>
  <div class="info" id="info"></div>
</main>
<div id="blocked">개발 확인용 페이지입니다. 로컬 서버(localhost)에서 열어 주세요.</div>

<!-- 게임 스크립트는 skills-test.js 가 index.html 의 목록을 읽어 같은 순서로 불러온다 (ui.js·net.js 는 빼고) -->
<script>document.write('<script src="skills-test.js?t=' + Date.now() + '"><\/script>');</script>
</body>
</html>
