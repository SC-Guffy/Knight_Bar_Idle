<!doctype html>
<!-- 게임 모음 사이트(sheet.sanai-club) 게시글에 올리는 페이지. 게임 파일 대신 웹 버전(GitHub Pages)을 띄워서
     푸시만 하면 게시글도 최신이 된다. 예전 게시글에서 하던 세이브(이 주소의 localStorage)는 게임이 준비되면 넘겨 준다 (ui.js start). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knight Bar</title>
<style>
  html, body { margin: 0; height: 100%; background: #12131c; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe src="https://sc-guffy.github.io/Knight_Bar_Idle/" allow="fullscreen; autoplay; clipboard-write"></iframe>
<script>
const GAME_ORIGIN = 'https://sc-guffy.github.io';
addEventListener('message', (e) => {
  if (e.origin !== GAME_ORIGIN || !e.data || e.data.type !== 'kb-ready') return;
  const items = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith('knight-bar')) items[k] = localStorage.getItem(k);
    }
  } catch {}
  e.source.postMessage({ type: 'kb-import', items }, GAME_ORIGIN);
});
</script>
</body>
</html>
