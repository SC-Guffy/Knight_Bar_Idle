<!doctype html><html lang="ko"><meta charset="utf-8"><title>견습기사 · 작은 대각 베기 v8</title><style>body{background:#181d26;color:#eee;font:16px system-ui;margin:32px;max-width:1100px}h1{font-size:26px}p{color:#b9c3d3}canvas{image-rendering:pixelated;background:#303946;width:384px;height:384px}section{display:flex;gap:24px;flex-wrap:wrap}button,input{margin:8px;padding:8px}img{image-rendering:pixelated;max-width:100%}label{display:inline-block}small{color:#aab8cb}</style><h1>견습기사 · 작은 대각 베기 v8</h1><p>원본 외형을 기준으로 만든 검토 시안입니다. 게임에는 적용하지 않았습니다.</p><section><div><h2>원본 대기</h2><canvas id="base" width="64" height="64"></canvas></div><div><h2>새 동작</h2><canvas id="anim" width="128" height="128"></canvas></div></section><button id="play">일시정지</button><button id="step">다음 포즈</button><label>속도 <input id="speed" type="range" min="0.15" max="1.5" step="0.05" value="1"><span id="speedText">1×</span></label><p id="label"></p><p>확인: 같은 검팔·방패팔 / 크림색 의상과 얼굴 / 준비 → 대각 베기 → 회수 / 발 접지와 몸통 회전</p><h2>v7 · 이전 동작</h2><img src="../squire-cut-v7/preview-slow.gif"><h2>v8 · 핵심 포즈</h2><img src="poses.png"><p id="notes">v6 미채택: 준비·회수에서 팔 교환. v8: 검손을 화면 오른쪽에 유지하고 가슴을 가로지르는 동작을 제거했습니다. 최종 게임 시트가 아닌 검토 시안입니다.</p><script>
const b=new Image();b.src='base.png';b.onload=()=>base.getContext('2d').drawImage(b,0,0);let manifest,frames=[],idx=0,playing=true,elapsed=0,last=performance.now();const ctx=anim.getContext('2d');fetch('manifest.json').then(r=>r.json()).then(async m=>{manifest=m;frames=await Promise.all(m.frames.map(f=>new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.src=f.file})));anim.width=m.width;anim.height=m.height;draw()});function draw(){if(!manifest)return;ctx.clearRect(0,0,anim.width,anim.height);ctx.drawImage(frames[idx],0,0);document.getElementById('label').textContent=`${idx+1} / ${frames.length} · ${manifest.frames[idx].name} · ${manifest.frames[idx].duration}ms`}play.onclick=()=>{playing=!playing;play.textContent=playing?'일시정지':'재생'};step.onclick=()=>{playing=false;play.textContent='재생';idx=(idx+1)%frames.length;elapsed=0;draw()};speed.oninput=()=>speedText.textContent=speed.value+'×';function tick(t){if(manifest&&playing){elapsed+=(t-last)*Number(speed.value);while(elapsed>=manifest.frames[idx].duration){elapsed-=manifest.frames[idx].duration;idx=(idx+1)%frames.length;draw()}}last=t;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
