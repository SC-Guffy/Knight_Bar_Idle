# 맥 설치 파일(dmg)은 맥에서만 만들 수 있어서 GitHub 의 macOS 머신에서 빌드하고, 지정한 릴리즈의 dmg 를 교체한다.
# Actions 탭 → build-mac → Run workflow 에서 태그(예: v0.4.0)를 넣고 실행한다.
name: build-mac

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'dmg 를 올릴 릴리즈 태그 (예: v0.4.0)'
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ad-hoc 서명(package.json 의 identity "-")이라 인증서를 찾지 않게 하고, 업로드는 아래에서 gh 로 한다
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: ls -l dist/*.dmg
      - run: gh release upload "${{ inputs.tag }}" dist/KnightBar-mac-arm64.dmg dist/KnightBar-mac-x64.dmg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
