<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' https: http://localhost:* http://127.0.0.1:*">
<title>기사 키우기 — 기사단</title>
<!-- 기사단 호스트 (docs/specs/guild.md 1단계). index.html 이 ?guild=1 로 켜진 맨 위 창이면 여기로 온다.
     슬롯마다 index.html?char=닉네임 iframe 을 띄우고, 매 프레임 모든 기사의 게임 시간을 돌리며, 고른 기사 하나만 그린다. -->
<link rel="stylesheet" href="src/skin/icons.css">
<style>
  :root { --text: #f3efe6; --muted: rgba(243, 239, 230, .62); --line: rgba(255, 255, 255, .14); --accent: #ffb13b; --dot: #ff3b30; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--text); user-select: none; -webkit-user-select: none;
    font: 12px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: radial-gradient(ellipse at 50% 20%, #2a2f4a, #12131c 70%); }
  /* 앱(Electron): 투명 창이라 바탕을 칠하지 않는다. 로그인 화면은 화면 전체를 살짝만 어둡게 */
  html.app, html.app body { background: transparent; }
  html.app #naming { background: rgba(8, 8, 14, .35); }
  #frames iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; pointer-events: none; background: transparent; }
  #frames iframe.on { visibility: visible; pointer-events: auto; }
  /* 슬롯 버튼: 보고 있는 기사 HUD 바로 위에 작게. 버튼 위에는 지금 하는 일 아이콘 하나 */
  #slots { position: fixed; z-index: 5; display: flex; gap: 3px; align-items: flex-end; }
  #slots[hidden] { display: none; }
  .gs { all: unset; position: relative; box-sizing: border-box; width: 22px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; }
  .gs .act { height: 14px; line-height: 14px; font-size: 11px; }
  .gs b { display: block; width: 22px; height: 17px; line-height: 16px; text-align: center; border-radius: 5px; font-size: 11px;
    background: rgba(18, 18, 26, .72); border: 1px solid var(--line); box-sizing: border-box; font-variant-numeric: tabular-nums; }
  .gs:hover b { background: rgba(40, 40, 56, .9); }
  .gs.on b { background: var(--accent); border-color: var(--accent); color: #1a1206; font-weight: 700; }
  .gs.empty b { color: var(--muted); }
  .gs.lock b { color: var(--muted); opacity: .7; }
  .gs .dot { position: absolute; right: -2px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--dot); }
  #tip { position: fixed; z-index: 6; padding: 4px 8px; border-radius: 7px; background: rgba(20, 20, 30, .94); border: 1px solid var(--line);
    white-space: nowrap; pointer-events: none; line-height: 1.4; }
  #tip small { color: var(--muted); }
  #gtoast { position: fixed; z-index: 6; left: 50%; bottom: 196px; transform: translateX(-50%); max-width: calc(100% - 40px); padding: 5px 12px; border-radius: 999px;
    background: rgba(20, 20, 30, .92); border: 1px solid var(--line); opacity: 0; transition: opacity .25s; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gtoast.show { opacity: 1; }
  #gtoast b { color: var(--accent); }
  /* 처음: 기사단 이름 짓기 */
  #naming { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(8, 8, 14, .6); }
  #naming[hidden] { display: none; }
  #naming .box { width: min(340px, calc(100% - 32px)); padding: 16px; border-radius: 12px; background: rgba(20, 20, 30, .97); border: 1px solid var(--line); }
  #naming h2 { margin: 0 0 6px; font-size: 15px; }
  #naming p { margin: 0 0 10px; color: var(--muted); line-height: 1.5; }
  #naming .row { display: flex; gap: 6px; }
  #naming input { flex: 1; min-width: 0; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--text); font: inherit; }
  #naming button { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #1a1206; font: inherit; font-weight: 700; cursor: pointer; }
  #naming .msg { min-height: 16px; margin-top: 6px; color: #ff6b6b; font-size: 11px; }
  #naming .row + .row { margin-top: 8px; }
  #naming button.ghost { flex: 1; background: rgba(255, 255, 255, .06); border-color: var(--line); color: var(--text); font-weight: 400; }
  #naming button.ghost:hover { background: rgba(255, 255, 255, .12); }
  #naming .gsi { min-height: 44px; display: flex; justify-content: center; align-items: center; margin: 4px 0 10px; }
  #naming .gsi .row { width: 100%; }
  #naming .tiny { margin: 10px 0 0; font-size: 11px; }
  #naming .code { display: inline-block; margin: 6px 0 8px; font-size: 28px; letter-spacing: 4px; color: var(--accent); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="frames"></div>
<div id="slots" hidden></div>
<div id="tip" hidden></div>
<div id="gtoast"></div>
<div id="naming" hidden>
  <div class="box"></div>
</div>
<script src="src/iconmap.js"></script>
<script src="src/guild.js"></script>
</body>
</html>
